<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenFOAM fvOptions Catalog</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --text: #1f2328; --muted: #6a737d;
  --border: #e1e4e8; --accent: #0b6e99; --accent-bg: #e6f3f8;
  --req: #c0392b; --code-bg: #f3f4f6; --chip: #eef1f4; --sel: #dbeef6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171a; --panel: #1d2024; --text: #e6e6e6; --muted: #9aa4ae;
    --border: #2d3238; --accent: #5cc3ec; --accent-bg: #173340;
    --req: #ff7b6b; --code-bg: #121416; --chip: #262a2f; --sel: #1f3a47;
  }
}
:root[data-theme="dark"] {
  --bg: #15171a; --panel: #1d2024; --text: #e6e6e6; --muted: #9aa4ae;
  --border: #2d3238; --accent: #5cc3ec; --accent-bg: #173340;
  --req: #ff7b6b; --code-bg: #121416; --chip: #262a2f; --sel: #1f3a47;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
code, pre { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 12.5px; }
header { display: flex; align-items: center; gap: 12px; padding: 10px 16px;
  border-bottom: 1px solid var(--border); background: var(--panel); }
header h1 { font-size: 16px; margin: 0; font-weight: 600; }
header .meta { color: var(--muted); font-size: 12px; }
header button { margin-left: auto; }
button { background: var(--chip); color: var(--text); border: 1px solid var(--border);
  border-radius: 6px; padding: 3px 9px; cursor: pointer; font: inherit; font-size: 12px; }
button:hover { border-color: var(--accent); }
.layout { display: grid; grid-template-columns: 340px 1fr; height: calc(100% - 49px); }
aside { border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
.controls { padding: 10px; border-bottom: 1px solid var(--border); }
#q { width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg); color: var(--text); font: inherit; }
#q:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.chip { font-size: 11.5px; padding: 1px 8px; border-radius: 10px; }
.chip.on { background: var(--accent); color: var(--panel); border-color: var(--accent); }
.opts { margin-top: 6px; font-size: 12px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
#list { overflow-y: auto; flex: 1; margin: 0; padding: 0; list-style: none; }
#list li { padding: 7px 12px; border-bottom: 1px solid var(--border); cursor: pointer; }
#list li:hover { background: var(--accent-bg); }
#list li.sel { background: var(--sel); }
#list .n { font-weight: 600; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
#list .s { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { font-size: 10px; padding: 0 5px; border-radius: 4px; background: var(--chip);
  color: var(--muted); margin-left: 4px; vertical-align: 1px; }
.count { padding: 6px 12px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); }
main { overflow-y: auto; padding: 20px 28px 60px; min-width: 0; }
main h2 { margin: 0 0 4px; font-size: 22px; font-family: ui-monospace, Menlo, Consolas, monospace; }
main h3 { font-size: 14px; margin: 22px 0 8px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.sub { color: var(--muted); font-size: 12.5px; }
.desc { white-space: pre-wrap; }
.codebox { position: relative; }
.codebox pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px;
  padding: 12px 14px; overflow-x: auto; margin: 0; }
.codebox button { position: absolute; top: 6px; right: 6px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12px; }
td.k { font-family: ui-monospace, Menlo, Consolas, monospace; white-space: nowrap; }
tr.req td.k { color: var(--req); font-weight: 600; }
.tablewrap { overflow-x: auto; }
.theading { font-weight: 600; margin: 12px 0 4px; }
ul.paths { margin: 0; padding-left: 18px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
details summary { cursor: pointer; color: var(--accent); }
.empty { color: var(--muted); margin-top: 40px; }
@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; height: auto; }
  aside { max-height: 45vh; }
  main { padding: 16px; }
}
</style>
</head>
<body>
<header>
  <h1>OpenFOAM fvOptions</h1>

  </aside>
  <main id="detail"><p class="empty">Select an fvOption. Entries go into <code>constant/fvOptions</code> (<code>system/fvOptions</code> is read only when the former does not exist).</p></main>

, Earth-bound observers need to account for the\nCoriolis force to correctly analyze the motion of objects. Earth\ncompletes one rotation per day, so for motions of everyday objects the\nCoriolis force is usually quite small compared with other forces; its\neffects generally become noticeable only for motions occurring over large\ndistances and long periods of time, such as large-scale movement of air in\nthe atmosphere or water in the ocean. Such motions are constrained by the\nsurface of Earth, so only the horizontal component of the Coriolis\nforce is generally important.\n\nCorrections applied on:\n\nRequired fields:\n\nReferences:", "example": "atmCoriolisUSource1\n{\n    // Mandatory entries (unmodifiable)\n    type             atmCoriolisUSource;\n\n    atmCoriolisUSourceCoeffs\n    {\n        // Mandatory (inherited) entries (unmodifiable)\n        selectionMode    all;\n\n        // Conditional mandatory entries (unmodifiable)\n        // Select either of the below\n\n        // Option-1: to directly input rotation vector\n        Omega        (0 0 5.65156e-5);\n\n        // Option-2: to indirectly input rotation vector\n        // by a latitude-period pair\n        latitude                   51.971;\n        planetaryRotationPeriod    23.9344694;\n    }\n\n    // Optional (inherited) entries\n    ...\n}", "otherExamples": ["U    | Velocity                  [m/s]", "U    | Velocity                  [m/s]", "Coriolis force. (n.d.).\nIn Wikipedia. Retrieved Feb 26, 2020, from https://w.wiki/JE5"], "tables": [{"heading": "", "rows": [{"name": "type", "desc": "Type name: atmCoriolisUSource", "type": "word", "reqd": "yes", "default": ""}, {"name": "latitude", "desc": "Geographic coordinate specifying the north–south position of a point on the surface of a planetary body [degree]", "type": "scalar", "reqd": "cond", "default": "0.0"}, {"name": "planetaryRotationPeriod", "desc": "Rotation period of the planetary body [h]", "type": "scalar", "reqd": "cond", "default       {\n            type lookup;\n            data\n            (\n                (-90 0.21 1.45)\n                (-18 0.21 1.45)\n                (-16 0.165 1.3)\n                (-14 0.125 1.1)\n                (-12 0.092 0.95)\n                (-10 0.07 0.8)\n                (-8 0.05 0.64)\n                (-6 0.04 0.5)\n                (-4 0.028 0.32)\n                (-2 0.022 0.18)\n                (0 0.02 0)\n                (2 0.022 0.18)\n                (4 0.028 0.32)\n                (6 0.04 0.5)\n                (8 0.05 0.64)\n                (10 0.07 0.8)\n                (12 0.092 0.95)\n                (14 0.125 1.1)\n                (16 0.165 1.3)\n                (18 0.21 1.45)\n                (90 0.21 1.45)\n            );\n        }\n    }\n}"}, "SemiImplicitSource": {"name": "SemiImplicitSource", "display": "<Type>SemiImplicitSource", "class": "SemiImplicitSource", "template": true, "variants": ["scalarSemiImplicitSource", "vectorSemiImplicitSource", "sphericalTensorSemiImplicitSource", "symmTensorSemiImplicitSource", "tensorSemiImplicitSource"], "group": "general", "header": "src/fvOptions/sources/general/semiImplicitSource/SemiImplicitSource.H", "library": "fvOptions", "libs": [], "summary": "Applies semi-implicit source within a specified region for Type, where <Type>=Scalar/Vector/SphericalTensor/SymmTensor/Tensor. The source rate coefficients are specified as pairs of Su-Sp coefficients, i.e.:", "description": "Applies semi-implicit source within a specified region for Type,\nwhere <Type>=Scalar/Vector/SphericalTensor/SymmTensor/Tensor.\nThe source rate coefficients are specified\nas pairs of Su-Sp coefficients, i.e.:\n\n[formula]\n\nwhere\n\n  S(x)    | net source for field 'x'\n  S_u     | explicit source contribution\n  S_p     | linearised implicit contribution", "example": "<Type>SemiImplicitSource1\n{\n    // Mandatory entries (unmodifiable)\n    type                <Type>SemiImplicitSource;\n\n    // Mandatory entries (runtime modifiable)\n    volumeMode          <volumeModeType>;\n\n    // Specification of sources (OpenFOAM-2206 and newer)\n    sources\n    {\n        // Specified as explicit(Su)/implicit(Sp) tuple:\n        k           (30.7 0);\n        epsilon     (1.5  0);\n\n        // Specified as Function1 or exprField\n        k\n        {\n            // Time-ramp from 0 to 30.7 at time 5\n            explicit table ((0 0) (5 30.7));\n            implicit none;\n        }\n        epsilon\n        {\n            explicit\n            {\n                type        exprField:\n                expression  \"(mag(pos()) < 0.1) ? 1.5 : 0\";\n            }\n        }\n    }\n\n    // Traditional specification of sources (OpenFOAM-2112 and older)\n    injectionRateSuSp\n    {\n        // Specified as explicit(Su)/implicit(Sp) tuple:\n        k           (30.7 0);\n        epsilon     (1.5  0);\n\n        // Specified as Function1\n        k\n        {\n            // Time-ramp from 0 to 30.7 at time 5\n            Su  table ((0 0) (5 30.7));\n            Sp  0;\n        }\n        epsilon\n        {\n            Su  1.5;\n            Sp  0;\n        }\n    }\n\n    // Mandatory/Optional (inherited) entries\n    ...\n}", "otherExamples": ["absolute  | Values are given as <quantity>\nspecific  | Values are given as <quantity>/m3"], "tables": [{"heading": "", "rows": [{"name": "type", "desc": "Type name: <Type>SemiImplicitSource", "type": "word", "reqd": "yes", "default": ""}, {"name": "volumeMode", "desc": "Volume mode type", "type": "word", "reqd": "yes", "default": ""}, {"name": "sources", "desc": "Explicit/implicit sources", "type": "dict", "reqd": "cond", "default": ""}, {"name": "injectionRateSuSp", "desc": "Explicit/implicit sources", "type": "dict", "reqd": "cond", "default": ""}]}], "inherited": ["fvOption.H", "cellSetOption.H"], "cellSet": true, "interRegion": false, "note": "Missing explicit/implicit, Su/Sp entries are equivalent to constant values\nof zero. However, at one entry  heat exchanges. The heat flux is calculated based on the Number of Thermal Units (NTU).", "description": "Applies a tabulated heat transfer model for inter-region heat exchanges.\nThe heat flux is calculated based on the Number of Thermal Units (NTU).\n\nA 2-D table of NTU as functions of the primary\nand secondary mass flow rates is required.\n\nThe exchanger geometry can be specified using either:\n- calculated:\n    - inlet area of each region and core volume determined by interrogating\n      mesh patches, and mesh-to-mesh interpolation volume\n    - calculated core volume can be partially blocked by specifying a\n      coreBlockageRatio [0-1] entry\n- user:\n    - inlet area of each region provided by the user\n    - core volume automatically calculated by the mesh-to-mesh\n      interpolation volume if not provided by user\n\nHeat transfer coefficient calculated by:\n\n[formula]\n\nWhere  C_{min}  is given by:\n\n[formula]", "example": "tabulatedNTUHeatTransfer1\n{\n    // Mandatory entries (unmodifiable)\n    type            tabulatedNTUHeatTransfer;\n\n    // Mandatory entries (runtime modifiable)\n    geometryMode    <geometryMode>;\n    outOfBounds     clamp;\n    file            \"ntuTable\";\n\n    // Optional entries (runtime modifiable)\n    U               <Uname>;\n    Unbr            <UnbrName>;\n    rho             <rhoName>;\n    rhoNbr          <rhoNbrName>;\n\n    // Conditional mandatory entries (runtime modifiable)\n\n        // when geometryMode=user\n        Ain             0.01728;\n        AinNbr          0.3456;\n\n        // when geometryMode=calculated\n        inletPatch      inlet_HWK;\n        inletPatchNbr   inlet_air;\n        inletBlockageRatio 0.10;\n        inletBlockageRatioNbr 0.04;\n        coreBlockageRatio 0;\n\n    // Conditional optional entries (runtime modifiable)\n\n        // when geometryMode=user\n        Vcore           0.01244;\n\n    // Mandatory/Optional (inherited) entries\n    ...\n}", "otherExamples": ["calculated    | Use settings computed internally\nuser          | Use settings provided by the user", "coolerToAir\n{\n    type            tabulatedNTUHeatTransfer;\n    active          yes;\n\n    tabulatedNTUHeatTransferCoeffs\n    {\n        interpolationMethod cellVolumeWeight;\n        nbrRegion       air;\n        master          true;\n\n        fields          (h);\n        outOfBounds     clamp;\n        file            \"ntuTable\";\n        nbrModel        airToCooler;\n        semiImplicit    no;\n\n\n        geometryMode    user;\n        Ain             0.01728;\n        AinNbr          0.3456;\n        Vcore           0.01244;  // Optional\n\n        // geometryMode    calculated;\n        // inletPatch      inlet_HWK;\n        // inletPatchNbr   inlet_air;\n        // inletBlockageRatio 0.10;\n        // inletBlockageRatioNbr 0.04;\n        // coreBlockageRatio 0;\n    }\n}"], "tables": [{"heading": "", "rows": [{"name": "type", "desc": "Type name: tabulatedNTUHeatTransfer", "type": "word", "reqd": "yes", "default": ""}, {"name": "geometryMode", "desc": "Geometry mode type", "type": "word", "reqd": "yes", "default": ""}, {"name": "file", "desc": "Heat transfer coefficient table", "type": "interpolate2DTable", "reqd": "yes", "default": ""}, {"name": "U", "desc": "Name of operand velocity field", "type": "word", "reqd": "no", "default": "U"}, {"name": "Unbr", "desc": "Name of operand neighbour velocity field", "type": "word", "reqd": "no", "default": "U"}, {"name": "Ain", "desc": "Inlet area [m2]", "type": "scalar", "reqd": "cond", "default": ""}, {"name": "AinNbr", "desc": "Neighbour region inlet area [m2]", "type": "scalar", "reqd": "cond", "default": ""}, {"name": "Vcore", "desc": "Heat exchanger core volume", "type": "scalar", "reqd": "cond", "default": ""}, {"name": "inletPatch", "desc": "Name of inlet patch", "type": "word", "reqd": "cond", "default": ""}, {"name": "inletNbrPatch", "desc": "Name of inlet patch neighbour", "type": "word", "reqd": "con const fvs = Object.values(DB.fvOptions);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
let group = "All", current = null;

document.getElementById("meta").textContent =
  `${DB.version} · ${fvs.length} fvOptions (${fvs.reduce((n, e) => n + (e.variants.length || 1), 0)} types) · built ${DB.built}`;

// Theme toggle (per-viewer convenience only)
const root = document.documentElement;
try { const t = localStorage.getItem("fvTheme"); if (t) root.dataset.theme = t; } catch (e) {}
document.getElementById("theme").onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("fvTheme", root.dataset.theme); } catch (e) {}
};

// Group chips
const groups = ["All", ...[...new Set(fvs.map(e => e.group))].sort()];
const chips = document.getElementById("chips");
groups.forEach(g => {
  const b = document.createElement("button");
  b.className = "chip" + (g === group ? " on" : ""); b.textContent = g;
  b.onclick = () => { group = g; [...chips.children].forEach(c => c.classList.toggle("on", c === b)); render(); };
  chips.appendChild(b);
});

function haystack(e) {
  return (e.name + " " + e.display + " " + e.variants.join(" ") + " " + e.description + " " + e.header + " " +
    (e.aliases || "") + " " + e.tables.flatMap(t => t.rows.map(r => r.name + " " + r.desc)).join(" ")).toLowerCase();
}
fvs.forEach(e => e._hay = haystack(e));

function render() {
  const q = document.getElementById("q").value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const onlyT = document.getElementById("optT").checked;
  const onlyZ = document.getElementById("optZ").checked;
  let es = fvs.filter(e => (group === "All" || e.group === group)
    && (!onlyT || e.tutorials.length) && (!onlyZ || e.cellSet)
    && q.every(w => e._hay.includes(w)));
  const score = (e) => q.filter(w => e.display.toLowerCase().includes(w)).length * 3
    + q.filter(w => (e.aliases || "").toLowerCase().includes(w)).length * 2;
  es.sort((a, b) => score(b) - score(a) || a.name.toLowerCase().localeCompare(b.name.toLowerCase()));
  const ul = document.getElementById("list");
  ul.innerHTML = es.map(e => `<li data-n="${esc(e.name)}" class="${current === e.name ? "sel" : ""}">
    <div class="n">${esc(e.display)}${e.tutorials.length ? '<span class="badge">tutorial</span>' : ""}${e.cellSet ? '<span class="badge">zone</span>' : ""}${e.interRegion ? '<span class="badge">inter-region</span>' : ""}${e.libs.length ? '<span class="badge">libs</span>' : ""}</div>
    <div class="s">${esc(e.group)} · ${esc(e.summary)}</div></li>`).join("");
  document.getElementById("count").textContent = `${es.length} shown`;
}

function codeBox(text) {
  return `<div class="codebox"><button onclick="copyCode(this)">Copy</button><pre>${esc(text)}</pre></div>`;
}
function copyCode(btn) {
  const t = btn.nextElementSibling.textContent;
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(
    () => { btn.textContent = "Copied"; setTimeout(() => btn.textContent = "Copy", 1200); },
    () => { const r = document.createRange(); r.selectNodeContents(btn.nextElementSibling);
            const s = getSelection(); s.removeAllRanges(); s.addRange(r); });
}
function tableHtml(tables) {
  return tables.map(t => `${t.heading ? `<div class="theading">${esc(t.heading)}</div>` : ""}
    <div class="tablewrap"><table><tr><th>Property</th><th>Type</th><th>Required</th><th>Default</th><th>Description</th></tr>
    ${t.rows.map(r => `<tr class="${r.reqd === "yes" ? "req" : ""}"><td class="k">${esc(r.name)}</td><td>${esc(r.type)}</td>
      <td>${esc(r.reqd)}</td><td>${esc(r.default || "-")}</td><td>${esc(r.desc)}</td></tr>`).join("")}</table></div>`).join("");
}

function show(name) {
  const e = DB.fvOptions[name]; if (!e) return;
  current = name;
  document.querySelectorAll("#list li").forEach(li => li.classList.toggle("sel", li.dataset.n === name));
  const t0 = e.variants.length ? e.variants[0] : e.name;
  let h = `<h2>${esc(e.display)}</h2>
    <div class="sub">${esc(e.group)} · <code>${esc(e.header)}</code> ·
    ${e.library ? "lib" + esc(e.library) : "built into the solver"}
    ${e.libs.length ? ` · needs <code>libs (${esc(e.libs.join(" "))})</code> unless the solver links it` : ""}</div>`;
  if (e.variants.length) h += `<div class="sub">Types: <code>${e.variants.map(esc).join("</code>, <code>")}</code></div>`;
  h += `<h3>Description</h3><div class="desc">${esc(e.description || "-")}</div>`;
  if (e.entry) h += `<h3>Ready-to-edit entry (constant/fvOptions)</h3>${codeBox(e.entry)}
    <div class="sub">Replace the &lt;placeholders&gt;. Generated like <code>foamFV add ${esc(t0)}</code>.</div>`;
  if (e.example) h += `<h3>Example (from header)</h3>${codeBox(e.example)}`;
  if (e.otherExamples.length) h += `<details><summary>More blocks from the header (${e.otherExamples.length})</summary>${e.otherExamples.map(codeBox).join("<br>")}</details>`;
  if (e.tables.length) h += `<h3>Parameters</h3>${tableHtml(e.tables)}`;
  if (e.inherited.length) {
    h += `<h3>Inherited entries</h3>`;
    e.inherited.forEach(b => {
      const base = DB.bases[b];
      h += base && base.tables.length
        ? `<details${b === "cellSetOption.H" ? " open" : ""}><summary>${esc(b)}${b === "cellSetOption.H" ? " — cell selection (selectionMode, cellZone, timeStart ...)" : ""}</summary>${tableHtml(base.tables)}</details>`
        : `<div><code>${esc(b)}</code></div>`;
    });
  }
  if (e.note) h += `<h3>Note</h3><div class="desc">${esc(e.note)}</div>`;
  h += `<h3>CLI</h3>${codeBox(`foamFV show ${t0} --inherited\nfoamFV example ${t0}\nfoamFV add ${t0} -case . ${e.cellSet ? "--zone <cellZone> " : ""}--insert`)}`;
  if (e.tutorials.length) h += `<h3>Used in tutorials (${e.tutorials.length})</h3><ul class="paths">${e.tutorials.map(t => `<li>${esc(t)}</li>`).join("")}</ul>`;
  if (e.seeAlso) h += `<h3>See also</h3><div class="desc">${esc(e.seeAlso)}</div>`;
  const main = document.getElementById("detail");
  main.innerHTML = h; main.scrollTop = 0;
  if (location.hash !== "#" + name) history.replaceState(null, "", "#" + name);
}

document.getElementById("list").onclick = ev => { const li = ev.target.closest("li"); if (li) show(li.dataset.n); };
["q", "optT", "optZ"].forEach(id => document.getElementById(id).addEventListener("input", render));
document.addEventListener("keydown", ev => {
  if (ev.key === "/" && document.activeElement.id !== "q") { ev.preventDefault(); document.getElementById("q").focus(); }
});
render();
const h0 = decodeURIComponent(location.hash.slice(1));
if (h0) {
  const hit = DB.fvOptions[h0] ? h0 : (fvs.find(e => e.variants.includes(h0)) || {}).name;
  if (hit) show(hit);
}
</script>
</body>
</html>
